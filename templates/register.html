{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}

<div class="auth-wrap">
  <div class="auth-card">
    <span class="label">JOIN CAMPUSCARE</span>
    <h2>SIGN UP.</h2>
    <div class="tagline">FOR STUDENTS ONLY</div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="field">
        <label for="name">FULL NAME</label>
        <input type="text" id="name" name="name" placeholder="Tapas Patel" required>
      </div>
      <div class="field">
        <label for="email">EMAIL</label>
        <input type="email" id="email" name="email" placeholder="you@college.edu" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="enrollment_no">ENROLLMENT NO.</label>
          <input type="text" id="enrollment_no" name="enrollment_no" placeholder="e.g. 220123456">
        </div>
        <div class="field">
          <label for="department">DEPARTMENT</label>
          <input type="text" id="department" name="department" placeholder="e.g. Computer Engg.">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="password">PASSWORD</label>
          <input type="password" id="password" name="password" placeholder="min. 6 characters" required>
        </div>
        <div class="field">
          <label for="confirm_password">CONFIRM PASSWORD</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="re-type password" required>
        </div>
      </div>
      <button type="submit" class="btn red full">CREATE ACCOUNT →</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div>

{% endblock %}
